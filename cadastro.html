<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro  De Clientes</title>

  <link rel="stylesheet" href="./css/style_cadastro.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Sistema De Gerenciamento De Clientes</h1>
      <p>Aplicação Web Interativo para Controle e Cadastro</p>
    </header>

    <section class="card">
      <h2 id="form-title">Cadastrar Novo Cliente</h2>
      <form id="client-form">
        <input type="hidden" id="client-id">

        <div class="form-row">
          <div class="form-group flex-2">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Ex : Cristian de Hungria" required>
          </div>

         

            <div class="form-group flex-1">
              <label for="cpf">CPF</label>
              <input type="text" id="cpf" placeholder="000.000.000.00" required>
            </div>


              <div class="form-group flex-2">
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="Ex : cristian@email.com" required>
        </div>

        <div class="form-group">
          <label for="cep">CEP</label>
          <input type="text" id="cep" placeholder="Ex : 49155766" required>
        </div>

                <div class="form-group">
                  <label for="cidade">Cidade </label>
                  <input type="text" id="cidae" placeholder="Ex : São Paulo" required>
                </div>


                <div class="form-group">
                  <label for="estado">Estado</label>
                  <input type="text" id="estado" placeholder="Ex : SP">
                </div>
                
                <div class="form-group">
                  <label for="rua">Rua</label>
                  <input type="text" id="rua" placeholder="Ex : laranjeira" required>
                </div>

                <div class="form-group">
                  <label for="Bairro">Bairro</label>
                  <input type="text" id="Bairro" placeholder="Ex : Cajueiro" required>
                </div>

                
              </div>

              <div class="button-group">
               <button type="submit" id="bnt-save" class="bnt bnt-primary">Salvar Cadastro</button>
               <button type="button" id="bnt-cancel" class="bnt bnt-secondary" style="display: none;">Cancelar Cadastro</button>
              </div>
            </form>
            </section>

            <div id="resultado-cadastro">
                
            </div>


            <section class="card">
              <h2>Clientes Cadastrados</h2>
              <div id="resultado-cadastro" class="list">

              </div>
            </section>

        </div>

  </div>
    <script src="./ts/script_cadastro.ts"></script>
</body>
</html>
