<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro  De Clientes</title>
</head>
<body>
  <div class="container">
    <header>
      <h1>Sistema De Gerenciamento De Clientes</h1>
      <p>Aplicação Web Interativo para Controle e Cadastro</p>
    </header>

    <section class="card">
      <h2 id="form-title">Cadastrar Novo Cliente</h2>
      <form id="client-form">
        <input type="hidden" id="client-id">

        <div class="form-row">
          <div class="form-group flex-2">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Ex : Maria Oliveira" required>
          </div>

            <div class="form-group flex-1">
              <label for="cpf">CPF</label>
              <input type="text" id="cpf" placeholder="000.000.000.00" required>
            </div>


              <div class="form-group flex-2">
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="Ex : maria@email.com" required>
              </div>



                <div class="form-group flex-1">
                  <label for="telefone">Telefone / whatsApp:</label>
                  <input type="tel" id="telefone" placeholder="Ex : (79) 988345462" required>
                </div>

                <div class="form-group">
                  <label for="endereco">Endereço</label>
                  <input type="text" placeholder="">
                </div>

                
              </div>

              


        </div>
      </form>
    </section>
  </div>
  
</body>
</html>
