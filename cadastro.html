<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro  De Clientes</title>
</head>
<body>
  <div class="container">
    <header>
      <h1>Sistema De Gerenciamento De Clientes</h1>
      <p>Aplicação Web Interativo para Controle e Cadastro</p>
    </header>

    <section class="card">
      <h2 id="form-title">Cadastrar Novo Cliente</h2>
      <form id="client-form">
        <input type="hidden" id="client-id">

        <div class="form-row">
          <div class="form-group flex-2">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Ex : Cristian de Hungria" required>
          </div>

          <div class="form-row">
            <div class="form-group flex-2">
              <label for="nome">Teste</label>
              <input type="text" id="nome" placeholder="Ex : Cristian de Hungria" required>
              <button></button><option value="text">FOi</option> </button>
              <button<option value="text">Não FOi</option></div><button></button>
            </div>
  

            <div class="form-group flex-1">
              <label for="cpf">CPF</label>
              <input type="text" id="cpf" placeholder="000.000.000.00" required>
            </div>

            <div class="form-group">
              <label for="data-nascimento">Data de Nascimento</label>
              <input type="data" id="data-nascimento" placeholder="Ex : 28/05/2008" required>
            </div>


              <div class="form-group flex-2">
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="Ex : cristian@email.com" required>
              </div>



                <div class="form-group flex-1">
                  <label for="telefone">Telefone / whatsApp:</label>
                  <input type="tel" id="telefone" placeholder="Ex : (79) 988345462" required>
                </div>

                <div class="form-group">
                  <label for="rua">Rua / Logradoura :</label>
                  <input type="text" id="rua" placeholder="Ex : Rua apocalipse" required>
                </div>

                <div class="form-group">
                  <label for="numero">Numero</label>
                  <input type="text" id="numero" placeholder="Ex : 20" required>
                </div>

                <div class="form-group">
                  <label for="bairro">Bairro</label>
                  <input type="text" id="bairro" placeholder="Ex : São Braz">
                </div>

                <div class="form-group">
                  <label for="cep">CEP</label>
                  <input type="text" id="cep" placeholder="Ex : 49155766" required>
                </div>
              </div>

              <div class="button-group">
               <button type="submit" id="bnt-save" class="bnt bnt-primary">Salvar Cadastro</button>
               <button type="button" id="bnt-cancel" class="bnt bnt-secondary"></button>
              </div>
          
              


        </div>
      </form>
    </section>
  </div>
  
</body>
</html>
